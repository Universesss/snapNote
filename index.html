<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snap → Text Converter</title>

    <!-- GOOGLE ADSENSE (Auto Ads) -->
   <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5256331725199580"
     crossorigin="anonymous"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body id="bodyElem" class="bg-light">

    <!-- NAVBAR -->
    <nav id="mainNavbar" class="navbar navbar-expand-lg navbar-light bg-light shadow-sm px-3">
        <a class="navbar-brand fw-bold" href="#">📸 Snap → 📝 Text</a>

        <div class="ms-auto d-flex align-items-center">
            <div class="form-check form-switch me-3">
                <input class="form-check-input" type="checkbox" id="darkModeToggle">
                <label class="form-check-label" for="darkModeToggle">🌙 Dark</label>
            </div>
        </div>
    </nav>

    <!-- ⭐ REKLAM ALANI (TOP BANNER) -->
    <div class="container mt-3 text-center">
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-5256331725199580"
            data-ad-slot="1111111111"  <!-- BURAYA SLOT ID GELECEK -->
            data-ad-format="horizontal"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <main class="container py-4">
        <div class="row g-4">

            <!-- LEFT: upload -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3">Görsel Yükle</h5>

                    <div id="dropArea" class="drop-zone" tabindex="0">
                        <p class="mb-0">📂 Görseli buraya sürükle veya tıkla</p>
                        <small class="text-muted d-block mt-1">Mobilde fotoğraf çekip yükleyebilirsin</small>
                        <input id="imageInput" type="file" accept="image/*" hidden>
                    </div>

                    <img id="preview" class="img-fluid rounded d-none mt-3" alt="preview">

                    <button id="convertBtn" class="btn btn-primary mt-3 w-100">Metni Çıkar (OCR)</button>

                    <div id="loading" class="text-center mt-3 d-none">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2 mb-0">Çalışıyor, bekle...</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: output -->
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <h5 class="mb-3">Çıkarılan Metin</h5>

                    <textarea id="outputText" class="form-control" rows="12"
                        placeholder="OCR sonucu burada görünecek..."></textarea>

                    <div class="d-flex gap-2 mt-3">
                        <button id="downloadPDF" class="btn btn-danger w-50">PDF İndir</button>
                        <button id="downloadDOCX" class="btn btn-success w-50">DOCX İndir</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- ⭐ ALT REKLAM ALANI -->
        <div class="text-center mt-4">
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-5256331725199580"
                data-ad-slot="2222222222"   <!-- BURAYA SLOT ID GELECEK -->
                data-ad-format="rectangle"
                data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.3.2/docx.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
